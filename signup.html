<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your guest account at Hotel &amp; Spa Adina to unlock member rates, express check-in, and personalized luxury services.">
  <title>Guest Registration | Hotel &amp; Spa Adina</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Main Project Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      background-image: linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.92)), url('assets/img/heroSlider/2.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.25rem;
    }
    .auth-box {
      background: #111111;
      border: 1px solid rgba(163, 125, 76, 0.35);
      border-radius: 4px;
      padding: 2.8rem 2.4rem;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .auth-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .auth-subtitle {
      font-family: var(--font-tertiary);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.85rem;
      color: var(--color-accent);
      margin-bottom: 0.4rem;
    }
    .auth-title {
      font-family: var(--font-primary);
      color: #ffffff;
      font-size: 2rem;
      font-weight: 400;
      margin: 0;
    }
    .auth-form-group {
      margin-bottom: 1.2rem;
    }
    .auth-form-group label {
      display: block;
      font-family: var(--font-tertiary);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #b0b0b0;
      margin-bottom: 0.4rem;
    }
    .auth-input-wrapper {
      position: relative;
    }
    .auth-input-wrapper i.input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-accent);
      font-size: 1rem;
      pointer-events: none;
    }
    .auth-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333333;
      border-radius: 3px;
      padding: 0.75rem 1rem 0.75rem 2.8rem;
      color: #ffffff;
      font-family: var(--font-secondary);
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .auth-input:focus {
      outline: none;
      border-color: var(--color-accent);
      background: #202020;
    }
    .password-toggle-btn {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #777777;
      cursor: pointer;
      font-size: 1.05rem;
      padding: 0;
    }
    .password-toggle-btn:hover {
      color: var(--color-accent);
    }
    .password-strength-bar {
      height: 4px;
      background: #222222;
      border-radius: 2px;
      margin-top: 0.45rem;
      overflow: hidden;
    }
    .password-strength-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .password-strength-label {
      font-size: 0.75rem;
      font-family: var(--font-secondary);
      color: #888888;
      margin-top: 0.25rem;
      display: block;
    }
    .auth-btn-submit {
      width: 100%;
      padding: 0.95rem;
      background: var(--color-accent);
      color: #0a0a0a;
      border: none;
      border-radius: 3px;
      font-family: var(--font-tertiary);
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
    }
    .auth-btn-submit:hover {
      background: var(--color-accent-hover);
      color: #ffffff;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.6rem;
      padding-top: 1.4rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-secondary);
      font-size: 0.88rem;
      color: #888888;
    }
    .auth-link {
      color: var(--color-accent);
      text-decoration: none;
      transition: var(--transition);
    }
    .auth-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
    .auth-alert {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: 3px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      font-family: var(--font-secondary);
    }
    .auth-alert-danger {
      background: rgba(220, 53, 69, 0.15);
      border: 1px solid #dc3545;
      color: #ff8591;
    }
    .auth-alert-success {
      background: rgba(40, 167, 69, 0.15);
      border: 1px solid #28a745;
      color: #7ce597;
    }
  </style>
</head>
<body class="auth-page">

  <!-- Minimal Header -->
  <header class="site-header" style="background: rgba(10, 10, 10, 0.95);">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="header-logo" aria-label="Hotel &amp; Spa Adina Home">
        <img src="assets/img/logo-white.svg" alt="Hotel &amp; Spa Adina Logo">
      </a>
      <a href="index.html" class="text-white text-decoration-none" style="font-family: var(--font-tertiary); font-size: 0.85rem; letter-spacing: 1.5px; text-transform: uppercase;">
        <i class="bi bi-arrow-left me-1 text-accent"></i> Back to Hotel
      </a>
    </div>
  </header>

  <!-- Sign Up Main -->
  <main class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <p class="auth-subtitle">Join the Luxury Experience</p>
        <h1 class="auth-title">Create Guest Profile</h1>
      </div>

      <div class="auth-alert auth-alert-danger" id="signupAlert"></div>

      <form id="signupForm" novalidate>
        <div class="row g-3">
          <div class="col-12 col-md-6 auth-form-group">
            <label for="firstName">First Name</label>
            <div class="auth-input-wrapper">
              <i class="bi bi-person input-icon"></i>
              <input type="text" id="firstName" class="auth-input" placeholder="Deepanshu" required autocomplete="given-name">
            </div>
          </div>
          <div class="col-12 col-md-6 auth-form-group">
            <label for="lastName">Last Name</label>
            <div class="auth-input-wrapper">
              <i class="bi bi-person input-icon"></i>
              <input type="text" id="lastName" class="auth-input" placeholder="Kashyap" required autocomplete="family-name">
            </div>
          </div>
        </div>

        <div class="auth-form-group">
          <label for="signupEmail">Email Address</label>
          <div class="auth-input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" id="signupEmail" class="auth-input" placeholder="name@domain.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-form-group">
          <label for="signupPhone">Phone Number (Optional)</label>
          <div class="auth-input-wrapper">
            <i class="bi bi-telephone input-icon"></i>
            <input type="tel" id="signupPhone" class="auth-input" placeholder="+91 98765 43210" autocomplete="tel">
          </div>
        </div>

        <div class="auth-form-group">
          <label for="signupPassword">Password</label>
          <div class="auth-input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" id="signupPassword" class="auth-input" placeholder="Create a secure password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="password-strength-bar">
            <div class="password-strength-fill" id="strengthFill"></div>
          </div>
          <span class="password-strength-label" id="strengthLabel">Min. 6 characters</span>
        </div>

        <div class="auth-form-group">
          <label for="signupConfirmPassword">Confirm Password</label>
          <div class="auth-input-wrapper">
            <i class="bi bi-shield-check input-icon"></i>
            <input type="password" id="signupConfirmPassword" class="auth-input" placeholder="Repeat your password" required autocomplete="new-password">
          </div>
        </div>

        <div class="form-check mt-3" style="font-family: var(--font-secondary); font-size: 0.85rem; color: #a0a0a0;">
          <input class="form-check-input" type="checkbox" id="agreeTerms" checked style="accent-color: var(--color-accent);">
          <label class="form-check-label" for="agreeTerms">
            I agree to the <a href="#" class="auth-link">Terms of Service</a> &amp; <a href="#" class="auth-link">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="auth-btn-submit" id="submitSignupBtn">
          <span>Complete Registration</span> <i class="bi bi-check-circle"></i>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" class="auth-link fw-bold ms-1" id="loginLink">Sign In</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    (function () {
      const form = document.getElementById('signupForm');
      const firstInput = document.getElementById('firstName');
      const lastInput = document.getElementById('lastName');
      const emailInput = document.getElementById('signupEmail');
      const phoneInput = document.getElementById('signupPhone');
      const passInput = document.getElementById('signupPassword');
      const confirmInput = document.getElementById('signupConfirmPassword');
      const termsCheck = document.getElementById('agreeTerms');
      const alertBox = document.getElementById('signupAlert');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const strengthFill = document.getElementById('strengthFill');
      const strengthLabel = document.getElementById('strengthLabel');
      const loginLink = document.getElementById('loginLink');

      // Preserve redirect param
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect') || 'index.html';
      if (loginLink && redirectUrl !== 'index.html') {
        loginLink.href = 'login.html?redirect=' + encodeURIComponent(redirectUrl);
      }

      // Password toggle
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          toggleBtn.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
      }

      // Password strength meter
      passInput.addEventListener('input', function () {
        const val = passInput.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        if (val.length === 0) {
          strengthFill.style.width = '0%';
          strengthLabel.textContent = 'Min. 6 characters';
          strengthLabel.style.color = '#888888';
        } else if (score <= 1) {
          strengthFill.style.width = '25%';
          strengthFill.style.backgroundColor = '#dc3545';
          strengthLabel.textContent = 'Weak password';
          strengthLabel.style.color = '#dc3545';
        } else if (score === 2) {
          strengthFill.style.width = '50%';
          strengthFill.style.backgroundColor = '#ffc107';
          strengthLabel.textContent = 'Medium strength';
          strengthLabel.style.color = '#ffc107';
        } else if (score === 3) {
          strengthFill.style.width = '75%';
          strengthFill.style.backgroundColor = '#17a2b8';
          strengthLabel.textContent = 'Strong password';
          strengthLabel.style.color = '#17a2b8';
        } else {
          strengthFill.style.width = '100%';
          strengthFill.style.backgroundColor = '#28a745';
          strengthLabel.textContent = 'Excellent security';
          strengthLabel.style.color = '#28a745';
        }
      });

      // Submit Form
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const first = firstInput.value.trim();
        const last = lastInput.value.trim();
        const email = emailInput.value.trim().toLowerCase();
        const phone = phoneInput.value.trim();
        const pass = passInput.value;
        const confirm = confirmInput.value;

        if (!first || !last || !email || !pass) {
          showAlert('Please fill in all required fields.', 'danger');
          return;
        }

        if (pass.length < 6) {
          showAlert('Password must be at least 6 characters long.', 'danger');
          return;
        }

        if (pass !== confirm) {
          showAlert('Passwords do not match. Please re-enter carefully.', 'danger');
          return;
        }

        if (!termsCheck.checked) {
          showAlert('Please accept our terms of service to proceed.', 'danger');
          return;
        }

        // Store user in local storage
        let users = [];
        try {
          users = JSON.parse(localStorage.getItem('adina_users') || '[]');
        } catch (err) {
          users = [];
        }

        const existing = users.find(u => u.email.toLowerCase() === email);
        if (existing || email === 'demo@hoteladina.com') {
          showAlert('An account with this email already exists. Please sign in.', 'danger');
          return;
        }

        const fullName = first + ' ' + last;
        const newUser = {
          name: fullName,
          email: email,
          phone: phone,
          password: pass,
          joined: new Date().toISOString()
        };

        users.push(newUser);
        localStorage.setItem('adina_users', JSON.stringify(users));

        // Auto login
        localStorage.setItem('adina_user', JSON.stringify({ name: fullName, email: email }));

        showAlert('Profile created successfully! Welcome to Adina, ' + first + '.', 'success');
        setTimeout(function () {
          window.location.href = redirectUrl;
        }, 900);
      });

      function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = 'auth-alert ' + (type === 'success' ? 'auth-alert-success' : 'auth-alert-danger');
        alertBox.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
